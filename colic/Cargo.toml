[package]
name = "colic"
version = "0.1.0"
edition = "2024"
description = "Ahead-of-time compiler for target-compiled COLI model artifacts"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "coli"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
colibri-abi = { path = "../colibri-abi" }
colibri-format = { path = "../colibri-format" }
qwen4-rs = { path = "../qwen4-rs" }
