name: one-shot-v4-sparse-kv-pr-trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'perf/v4-sparse-kv-view' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v4-sparse-kv-view
          fetch-depth: 0

      - name: Execute guarded patch embedded in staging workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/v4-sparse-kv-one-shot.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'v4-sparse-kv-guarded-patch', 'exec'))
          PY

      - name: Verify diff
        run: git diff --check

      - name: Build and run V4 unit harness
        working-directory: c
        run: |
          make tests/test_deepseek_v4
          ./tests/test_deepseek_v4

      - name: Commit verified source patch
        shell: bash
        run: |
          rm .github/workflows/v4-sparse-kv-one-shot.yml
          rm .github/workflows/v4-sparse-kv-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/deepseek_v4.c c/deepseek_v4_internal.h c/tests/test_deepseek_v4.c .github/workflows/v4-sparse-kv-one-shot.yml .github/workflows/v4-sparse-kv-pr-trigger.yml
          git diff --cached --check
          git commit -m "perf(v4): remove sparse attention KV materialization"
          git push origin HEAD:perf/v4-sparse-kv-view
