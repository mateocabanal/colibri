name: Qwen two-token prefix benchmark macOS

on:
  push:
    branches: [feat/qwen-prompt-cache-metrics]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qwen-prompt-cache-metrics
          fetch-depth: 0
      - run: brew install libomp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate corrected hybrid fixture and build native Qwen
        run: |
          python c/tools/make_qwen_moe_tiny.py --output c/qwen_moe_tiny --force
          make -C c qwen_moe ARCH=native
      - name: Run two-token fixed-memory prefix benchmark
        run: |
          printf '<t005><t007><t009><t011><t013><t017><t019><t023>' > /tmp/qwen-prefix.txt
          printf '<t029><t031><t037><t041><t043><t047>' > /tmp/qwen-tail.txt
          python3 c/tools/benchmark_qwen_prefix_cache.py \
            --binary c/qwen_moe --model c/qwen_moe_tiny \
            --prefix-file /tmp/qwen-prefix.txt --tail-file /tmp/qwen-tail.txt \
            --memory-gb 4.5 --cache-mb 8 --min-prefix-tokens 1 \
            --context 128 --max-tokens 2 --trials 1 \
            --output /tmp/qwen-prefix-macos.json
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/qwen-prefix-macos.json'))
          pair = p['pairs'][0]
          assert p['matched_tokens'] == 8, p
          assert pair['cache_off']['measure']['data_frames'] >= 2, pair
          assert pair['cache_on']['measure']['data_frames'] >= 2, pair
          assert pair['cache_off']['measure']['output_hex'] == pair['cache_on']['measure']['output_hex'], pair
          assert p['snapshot_bytes'] > 0, p
          assert p['summary']['first_to_second_on_median_sec'] >= 0, p
          assert p['summary']['completion_on_median_sec'] >= p['summary']['ttft_on_median_sec'], p
          print('native macOS two-token Qwen prefix benchmark: ok')
          PY
      - name: Remove temporary validation workflow
        if: success()
        run: |
          git rm .github/workflows/qwen-prefix-two-token-macos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(qwen): remove temporary macOS two-token gate"
          git push origin HEAD:feat/qwen-prompt-cache-metrics
