name: one-shot-v4-sparse-kv-patch

on:
  push:
    branches:
      - perf/v4-sparse-kv-view

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v4-sparse-kv-view
          fetch-depth: 0

      - name: Apply guarded sparse-KV patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, count, label):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: expected {count} matches, found {actual}")
              return text.replace(old, new)

          header_path = Path("c/deepseek_v4_internal.h")
          header = header_path.read_text()
          old_decl = '''int coli_v4_sparse_attention_ref(float *output, const float *queries,
                                           const float *kv, const float *sinks,
                                           const int *indices, int heads,
                                           int head_dimension, int kv_count, int topk,
                                           float softmax_scale);
          '''
          new_decl = '''typedef struct {
              const float *window;
              int window_count;
              const float *compressed;
              int compressed_count;
          } ColiDeepSeekV4SparseKVView;

          int coli_v4_sparse_attention_view_ref(
              float *output, const float *queries,
              const ColiDeepSeekV4SparseKVView *kv, const float *sinks,
              const int *indices, int heads, int head_dimension, int topk,
              float softmax_scale);

          /* Contiguous compatibility oracle used by unit tests and legacy helpers. */
          int coli_v4_sparse_attention_ref(float *output, const float *queries,
                                           const float *kv, const float *sinks,
                                           const int *indices, int heads,
                                           int head_dimension, int kv_count, int topk,
                                           float softmax_scale);
          '''
          header = replace_exact(header, old_decl, new_decl, 1, "sparse declaration")
          header_path.write_text(header)

          source_path = Path("c/deepseek_v4.c")
          source = source_path.read_text()
          start_marker = "int coli_v4_sparse_attention_ref(float *output, const float *queries,"
          end_marker = "\n#endif /* COLI_V4_UNIT_SPARSE_ATTENTION */"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("sparse implementation start not found")
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("sparse implementation end not found")
          old_region = source[start:end]
          if old_region.count("int coli_v4_sparse_attention_ref") != 1:
              raise SystemExit("unexpected sparse implementation region")

          new_region = r'''typedef struct {
              const float *row;
              float score;
          } V4SparseSelectedRow;

          static const float *v4_sparse_kv_row(
                  const ColiDeepSeekV4SparseKVView *kv, int index,
                  int head_dimension) {
              if (!kv || index < 0 || head_dimension < 1) return NULL;
              if (index < kv->window_count) {
                  if (!kv->window) return NULL;
                  return kv->window + (size_t)index * head_dimension;
              }
              int compressed = index - kv->window_count;
              if (compressed < 0 || compressed >= kv->compressed_count ||
                  !kv->compressed)
                  return NULL;
              return kv->compressed + (size_t)compressed * head_dimension;
          }

          int coli_v4_sparse_attention_view_ref(
                  float *output, const float *queries,
                  const ColiDeepSeekV4SparseKVView *kv, const float *sinks,
                  const int *indices, int heads, int head_dimension, int topk,
                  float softmax_scale) {
              if (!output || !queries || !kv || !sinks || !indices || heads < 1 ||
                  head_dimension < 1 || topk < 1 || !(softmax_scale > 0.0f) ||
                  kv->window_count < 0 || kv->compressed_count < 0 ||
                  (kv->window_count == 0 && kv->compressed_count == 0))
                  return -1;
              V4SparseSelectedRow *selected =
                  malloc((size_t)topk * sizeof(*selected));
              if (!selected) return -1;
              for (int head = 0; head < heads; head++) {
                  const float *query = queries + (size_t)head * head_dimension;
                  float maximum = -INFINITY;
                  for (int rank = 0; rank < topk; rank++) {
                      int index = indices[rank];
                      if (index < 0) {
                          selected[rank].row = NULL;
                          selected[rank].score = -INFINITY;
                          continue;
                      }
                      const float *row = v4_sparse_kv_row(kv, index, head_dimension);
                      if (!row) {
                          free(selected);
                          return -1;
                      }
                      float score = v4_attn_dot(query, row, head_dimension);
                      score *= softmax_scale;
                      selected[rank].row = row;
                      selected[rank].score = score;
                      if (score > maximum) maximum = score;
                  }
                  if (!isfinite(maximum)) {
                      free(selected);
                      return -1;
                  }
                  float denominator = expf(sinks[head] - maximum);
                  float *head_output = output + (size_t)head * head_dimension;
                  memset(head_output, 0, (size_t)head_dimension * sizeof(*head_output));
                  for (int rank = 0; rank < topk; rank++) {
                      const float *value = selected[rank].row;
                      if (!value) continue;
                      float probability = expf(selected[rank].score - maximum);
                      denominator += probability;
                      /* TileLang casts the exp fragment to BF16 before value GEMM. */
                      probability = coli_bf16_round(probability);
                      v4_attn_accumulate(head_output, value, probability,
                                         head_dimension);
                  }
                  for (int column = 0; column < head_dimension; column++)
                      head_output[column] =
                          coli_bf16_round(head_output[column] / denominator);
              }
              free(selected);
              return 0;
          }

          int coli_v4_sparse_attention_ref(float *output, const float *queries,
                                           const float *kv, const float *sinks,
                                           const int *indices, int heads,
                                           int head_dimension, int kv_count, int topk,
                                           float softmax_scale) {
              if (!kv || kv_count < 1) return -1;
              ColiDeepSeekV4SparseKVView view = {kv, kv_count, NULL, 0};
              return coli_v4_sparse_attention_view_ref(
                  output, queries, &view, sinks, indices, heads, head_dimension,
                  topk, softmax_scale);
          }
          '''
          source = source[:start] + new_region + source[end:]

          token_alloc = '''        int topk = state->window_size + compressed_selected;
                  int kv_count = state->window_size + state->compressed_count;
                  int *indices = malloc((size_t)topk * sizeof(*indices));
                  float *all_kv = state->compressed_count
                      ? malloc((size_t)kv_count * head_dim * sizeof(*all_kv)) : NULL;
                  if (!indices || (state->compressed_count && !all_kv)) result = -1;
          '''
          token_alloc_new = '''        int topk = state->window_size + compressed_selected;
                  int *indices = malloc((size_t)topk * sizeof(*indices));
                  if (!indices) result = -1;
          '''
          source = replace_exact(source, token_alloc, token_alloc_new, 3,
                                 "token sparse allocation")

          token_copy = '''            const float *kv_values = state->kv;
                      if (state->compressed_count) {
                          memcpy(all_kv, state->kv,
                                 (size_t)state->window_size * head_dim * sizeof(*all_kv));
                          memcpy(all_kv + (size_t)state->window_size * head_dim,
                                 state->compressed,
                                 (size_t)state->compressed_count * head_dim * sizeof(*all_kv));
                          kv_values = all_kv;
                      }
          '''
          source = replace_exact(source, token_copy, "", 3, "token KV materialization")

          token_call = '''            result = coli_v4_sparse_attention_ref(
                          attended, q, kv_values, sinks, indices, heads, head_dim,
                          kv_count, topk,
                          1.0f / sqrtf((float)head_dim));
          '''
          token_call_new = '''            ColiDeepSeekV4SparseKVView kv_view = {
                          state->kv, state->window_size,
                          state->compressed, state->compressed_count
                      };
                      result = coli_v4_sparse_attention_view_ref(
                          attended, q, &kv_view, sinks, indices, heads, head_dim,
                          topk, 1.0f / sqrtf((float)head_dim));
          '''
          source = replace_exact(source, token_call, token_call_new, 3,
                                 "token sparse call")
          source = replace_exact(source,
                                 "        free(all_kv);\n        free(indices);\n",
                                 "        free(indices);\n", 3,
                                 "token sparse free")

          batch_alloc = '''        int topk = state->window_size + selected;
                  int kv_count = state->window_size + compressed_count;
                  int *indices = malloc((size_t)topk * sizeof(*indices));
                  float *all_kv = compressed_count
                      ? malloc((size_t)kv_count * head_dim * sizeof(*all_kv)) : NULL;
                  if (!indices || (compressed_count && !all_kv)) result = -1;
          '''
          batch_alloc_new = '''        int topk = state->window_size + selected;
                  int *indices = malloc((size_t)topk * sizeof(*indices));
                  if (!indices) result = -1;
          '''
          source = replace_exact(source, batch_alloc, batch_alloc_new, 1,
                                 "batch sparse allocation")

          batch_copy = '''            const float *values = state->kv;
                      if (compressed_count) {
                          memcpy(all_kv, state->kv,
                                 (size_t)state->window_size * head_dim * sizeof(*all_kv));
                          memcpy(all_kv + (size_t)state->window_size * head_dim,
                                 state->compressed,
                                 (size_t)compressed_count * head_dim * sizeof(*all_kv));
                          values = all_kv;
                      }
          '''
          source = replace_exact(source, batch_copy, "", 1, "batch KV materialization")

          batch_call = '''            result = coli_v4_sparse_attention_ref(
                          item_attended, item_q, values, sinks, indices, heads, head_dim,
                          kv_count, topk, 1.0f / sqrtf((float)head_dim));
          '''
          batch_call_new = '''            ColiDeepSeekV4SparseKVView kv_view = {
                          state->kv, state->window_size,
                          state->compressed, compressed_count
                      };
                      result = coli_v4_sparse_attention_view_ref(
                          item_attended, item_q, &kv_view, sinks, indices, heads,
                          head_dim, topk, 1.0f / sqrtf((float)head_dim));
          '''
          source = replace_exact(source, batch_call, batch_call_new, 1,
                                 "batch sparse call")
          source = replace_exact(source, "        free(all_kv); free(indices);\n",
                                 "        free(indices);\n", 1, "batch sparse free")

          if "all_kv" in source:
              raise SystemExit("all_kv remains after guarded patch")
          source_path.write_text(source)

          test_path = Path("c/tests/test_deepseek_v4.c")
          test = test_path.read_text()
          marker = "    int invalid[1] = {3};\n"
          insertion = r'''    {
              float window[6] = {1, 0, 0, 1, 1, 1};
              float compressed[4] = {2, 0, 0, 2};
              float joined[10];
              memcpy(joined, window, sizeof(window));
              memcpy(joined + 6, compressed, sizeof(compressed));
              ColiDeepSeekV4SparseKVView view = {window, 3, compressed, 2};
              float reference[2], split[2];

              /* Wrapped ring order plus indexer-style reversed compressed rows. */
              int wrapped_indexed[4] = {2, 0, 4, 3};
              if (coli_v4_sparse_attention_ref(reference, query, joined, sink,
                                               wrapped_indexed, 1, 2, 5, 4, 1.0f) ||
                  coli_v4_sparse_attention_view_ref(split, query, &view, sink,
                                                    wrapped_indexed, 1, 2, 4, 1.0f) ||
                  !close_enough_sparse(reference[0], split[0]) ||
                  !close_enough_sparse(reference[1], split[1]))
                  return 1;

              /* Non-indexer sequential compressed selection. */
              int sequential[5] = {0, 1, 2, 3, 4};
              if (coli_v4_sparse_attention_ref(reference, query, joined, sink,
                                               sequential, 1, 2, 5, 5, 1.0f) ||
                  coli_v4_sparse_attention_view_ref(split, query, &view, sink,
                                                    sequential, 1, 2, 5, 1.0f) ||
                  !close_enough_sparse(reference[0], split[0]) ||
                  !close_enough_sparse(reference[1], split[1]))
                  return 1;

              /* Zero and one compressed row boundaries. */
              view.compressed = NULL;
              view.compressed_count = 0;
              int window_only[3] = {0, 1, 2};
              if (coli_v4_sparse_attention_ref(reference, query, window, sink,
                                               window_only, 1, 2, 3, 3, 1.0f) ||
                  coli_v4_sparse_attention_view_ref(split, query, &view, sink,
                                                    window_only, 1, 2, 3, 1.0f) ||
                  !close_enough_sparse(reference[0], split[0]) ||
                  !close_enough_sparse(reference[1], split[1]))
                  return 1;
              view.compressed = compressed;
              view.compressed_count = 1;
              int one_compressed[3] = {0, 3, 1};
              if (coli_v4_sparse_attention_ref(reference, query, joined, sink,
                                               one_compressed, 1, 2, 4, 3, 1.0f) ||
                  coli_v4_sparse_attention_view_ref(split, query, &view, sink,
                                                    one_compressed, 1, 2, 3, 1.0f) ||
                  !close_enough_sparse(reference[0], split[0]) ||
                  !close_enough_sparse(reference[1], split[1]))
                  return 1;
              int invalid_split[1] = {4};
              if (coli_v4_sparse_attention_view_ref(split, query, &view, sink,
                                                    invalid_split, 1, 2, 1, 1.0f) == 0)
                  return 1;
          }
          '''
          test = replace_exact(test, marker, insertion + marker, 1,
                               "sparse view test insertion")
          test_path.write_text(test)
          PY

      - name: Verify diff has no whitespace errors
        run: git diff --check

      - name: Build and run V4 unit harness
        working-directory: c
        run: |
          make tests/test_deepseek_v4
          ./tests/test_deepseek_v4

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/v4-sparse-kv-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/deepseek_v4.c c/deepseek_v4_internal.h c/tests/test_deepseek_v4.c .github/workflows/v4-sparse-kv-one-shot.yml
          git diff --cached --check
          git commit -m "perf(v4): remove sparse attention KV materialization"
          git push origin HEAD:perf/v4-sparse-kv-view
