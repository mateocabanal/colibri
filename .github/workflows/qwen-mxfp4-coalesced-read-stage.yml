name: Stage Qwen MXFP4 coalesced reads

on:
  push:
    branches: [feat/qwen36-mxfp4]
    paths:
      - .github/scripts/qwen_mxfp4_coalesced_read.py
      - .github/workflows/qwen-mxfp4-coalesced-read-stage.yml

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged patch
        run: |
          python3 .github/scripts/qwen_mxfp4_coalesced_read.py
          git diff --check
      - name: Validate MXFP4 layout and Qwen runtime
        run: |
          cc -O2 -Wall -Wextra -Werror -I c \
            c/tests/test_mxfp4_expert.c c/mxfp4_expert.c c/coli_format.c \
            -lpthread -o /tmp/test_mxfp4_expert
          /tmp/test_mxfp4_expert
          make -C c clean
          make -C c tests/test_qwen_moe -j2
          ./c/tests/test_qwen_moe
      - name: Build Qwen CPU
        if: runner.os == 'Linux'
        run: |
          make -C c clean
          make -C c qwen_moe -j2
      - name: Build Qwen Metal
        if: runner.os == 'macOS'
        run: |
          make -C c clean
          make -C c qwen_moe METAL=1 -j2

  commit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit
        run: |
          python3 .github/scripts/qwen_mxfp4_coalesced_read.py
          git diff --check
          rm -f .github/scripts/qwen_mxfp4_coalesced_read.py
          rm -f .github/workflows/qwen-mxfp4-coalesced-read-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(qwen): coalesce MXFP4 expert reads'
          git push origin HEAD:feat/qwen36-mxfp4
