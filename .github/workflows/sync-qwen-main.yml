name: sync qwen prompt cache with main

on:
  push:
    branches: [sync/qwen-prompt-cache-main-20260817]

permissions:
  contents: write

concurrency:
  group: sync-qwen-prompt-cache-main
  cancel-in-progress: false

jobs:
  reconcile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/qwen-prompt-cache-main-20260817
          fetch-depth: 0
      - name: Reconcile prompt cache onto optimized runtime
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          python3 c/tools/reconcile_qwen_prefix_main.py
          git diff --check
          grep -Fq '#include "qwen_prefix_cache.h"' c/qwen_moe.c
          grep -Fq '#include "mxfp4_expert.h"' c/qwen_moe.c
          grep -Fq '#include "mxfp4_runtime.h"' c/qwen_moe.c
          grep -Fq 'qwen_prefix_cache_restore' c/qwen_moe.c
          grep -Fq 'qwen_prefix_capture_once' c/qwen_moe.c
          grep -Fq 'qwen_prefix_cache_ram_cap' c/qwen_moe.c
          grep -Fq 'qprof_prefill_end' c/qwen_moe.c
          grep -Fq 'qprof_request_end' c/qwen_moe.c
      - name: Build optimized Qwen
        run: |
          set -euxo pipefail
          make -C c qwen_moe ARCH=x86-64-v3
      - name: Run prompt-cache and MXFP4 unit gates
        run: |
          set -euxo pipefail
          python3 -m py_compile c/tools/benchmark_qwen_prefix_cache.py c/tests/test_qwen_prefix_cache.py c/tests/test_qwen_prefix_serve.py
          python3 c/tests/test_qwen_prefix_cache.py
          make -C c -f Makefile.csf test
      - name: Publish validated reconciliation
        run: |
          set -euxo pipefail
          git add c/qwen_moe.c c/Makefile
          git commit -m 'chore(qwen): reconcile prompt cache with optimized main'
          git rm c/tools/reconcile_qwen_prefix_main.py .github/workflows/sync-qwen-main.yml
          git commit -m 'chore(qwen): remove temporary main sync helpers'
          git push origin HEAD:sync/qwen-prompt-cache-main-20260817
