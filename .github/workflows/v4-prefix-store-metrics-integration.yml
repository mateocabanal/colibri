name: V4 prefix store metrics integration

on:
  push:
    branches: [feat/v4-prompt-cache-metrics]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v4-prompt-cache-metrics
          fetch-depth: 0
      - name: Apply exact metrics patch
        run: python3 c/tools/apply_v4_prefix_store_metrics_patch.py
      - name: Check and compile prefix test/benchmark
        run: |
          git diff --check
          make -C c -f Makefile.deepseek-v4 deepseek-v4-clean
          make -C c -f Makefile.deepseek-v4 deepseek-v4-prefix-cache-test ARCH=x86-64-v3
      - name: Commit clean stacked change
        run: |
          git rm .github/workflows/v4-prefix-store-metrics-integration.yml c/tools/apply_v4_prefix_store_metrics_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/coli_v4_prefix_cache.h c/coli_v4_prefix_cache.c c/coli_v4_generate_stats_cache.c c/tools/benchmark_v4_prefix_cache.c
          git commit -m "perf(v4): report prompt snapshot capture cost"
          git push origin HEAD:feat/v4-prompt-cache-metrics
