name: Qwen MXFP4 Metal apply

on:
  push:
    branches: [feat/qwen36-mxfp4]

permissions:
  contents: write

jobs:
  apply-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Metal integration source
        run: |
          python3 tools/apply_qwen_mxfp4_metal.py
          python3 tools/fix_qwen_mxfp4_metal_shader.py
      - name: Re-run portable Qwen tests
        run: make -C c tests/test_qwen_moe && ./c/tests/test_qwen_moe
      - name: Commit Metal source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/backend_metal.h c/backend_metal.mm c/qwen_moe.c c/tests/test_backend_metal.mm
          git commit -m "fix(metal): decode MXFP4 in fused routed expert kernel"
          git push origin HEAD:feat/qwen36-mxfp4
