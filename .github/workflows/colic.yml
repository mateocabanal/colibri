name: colic

on:
  push:
    branches: [main, dev]
    paths:
      - 'colic/**'
      - 'docs/coli-serving-format-*.md'
      - 'c/coli_format.c'
      - 'c/coli_format.h'
      - '.github/workflows/colic.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'colic/**'
      - 'docs/coli-serving-format-*.md'
      - 'c/coli_format.c'
      - 'c/coli_format.h'
      - '.github/workflows/colic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustc --version --verbose
          cargo --version
      - name: Formatting
        run: cargo fmt --manifest-path colic/Cargo.toml -- --check
      - name: Build and unit tests
        run: cargo test --locked --manifest-path colic/Cargo.toml --all-targets
