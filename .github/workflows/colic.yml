name: colic

on:
  pull_request:
    paths:
      - 'colic/**'
      - '.github/workflows/colic.yml'
  push:
    branches: [main]
    paths:
      - 'colic/**'
      - '.github/workflows/colic.yml'
  workflow_dispatch:

jobs:
  test:
    name: colic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: colic
      - name: Test
        run: cargo test --manifest-path colic/Cargo.toml --all-targets
      - name: Format working tree
        run: cargo fmt --manifest-path colic/Cargo.toml --all
      - name: Save rustfmt patch
        shell: bash
        run: git diff -- colic > rustfmt-${{ matrix.os }}.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ matrix.os }}
          path: rustfmt-${{ matrix.os }}.patch
      - name: Verify formatting
        run: git diff --exit-code -- colic
