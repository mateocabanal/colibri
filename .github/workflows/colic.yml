name: colic

on:
  pull_request:
    paths:
      - 'colic/**'
      - 'abi/coli-target-registry.toml'
      - 'c/generated/coli_target_registry.h'
      - 'tools/gen_target_registry.py'
      - '.github/workflows/colic.yml'
  push:
    branches: [main]
    paths:
      - 'colic/**'
      - 'abi/coli-target-registry.toml'
      - 'c/generated/coli_target_registry.h'
      - 'tools/gen_target_registry.py'
      - '.github/workflows/colic.yml'
  workflow_dispatch:

jobs:
  test:
    name: colic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: colic
      - name: Check generated target registry
        run: python3 tools/gen_target_registry.py --check
      - name: Test
        run: cargo test --manifest-path colic/Cargo.toml --all-targets
