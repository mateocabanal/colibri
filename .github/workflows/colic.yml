name: colic

on:
  pull_request:
    paths:
      - 'colic/**'
      - '.github/workflows/colic.yml'
  push:
    branches: [main]
    paths:
      - 'colic/**'
      - '.github/workflows/colic.yml'
  workflow_dispatch:

jobs:
  test:
    name: colic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: colic
      - name: Format
        run: cargo fmt --manifest-path colic/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --manifest-path colic/Cargo.toml --all-targets
