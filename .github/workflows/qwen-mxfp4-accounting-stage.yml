name: Qwen expert residency accounting stage

on:
  push:
    branches: [feat/qwen36-mxfp4]

permissions:
  contents: write

jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Apply accounting fix
        run: python3 tools/apply_qwen_mxfp4_cache_accounting.py
      - name: Run Qwen unit tests
        run: make -C c tests/test_qwen_moe && ./c/tests/test_qwen_moe
      - name: Commit accounting fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/qwen_moe.c c/tests/test_qwen_moe.c
          git commit -m "fix(qwen): report actual expert cache residency"
          git push origin HEAD:feat/qwen36-mxfp4
