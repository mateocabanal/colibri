name: v4-prefix-ssd

on:
  pull_request:
    branches: [main]
    paths:
      - 'c/coli_v4_prefix_cache.c'
      - 'c/coli_v4_prefix_cache_impl.inc'
      - 'c/coli_v4_prefix_disk.c'
      - 'c/coli_v4_prefix_disk.h'
      - 'c/coli_v4_prefix_disk_shared.inc'
      - 'c/coli_v4_generate_stats_cache.c'
      - 'c/coli_v4_package_tensor_source.h'
      - 'c/coli_v4_*snapshot_size.c'
      - 'c/tests/test_v4_prefix_disk_sessions.c'
      - 'c/Makefile.deepseek-v4.units'
      - 'c/tools/make_deepseek_v4_tiny.py'
      - 'colic/**'

permissions:
  contents: read

concurrency:
  group: v4-prefix-ssd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ssd-only-restart:
    # The generated tiny V4 source carries canonical packed MXFP4 routed
    # experts. Compile it explicitly for the frozen Apple8 target and require
    # the target-aware verifier to accept the production 0x0103 package.
    name: Linux Apple8 exact-source contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate tiny V4 source fixture
        run: python c/tools/make_deepseek_v4_tiny.py --output c/deepseek_v4_tiny --force
      - name: Compile and verify exact Apple8 package
        run: |
          cargo run --manifest-path colic/Cargo.toml -- \
            compile c/deepseek_v4_tiny \
            --target macos-arm64-metal-apple8-v1 \
            --quant exact --codec none --opt default \
            -o c/deepseek_v4_tiny.coli --verify
          test -f c/deepseek_v4_tiny.coli/manifest.coli
          python - <<'PY'
          from pathlib import Path
          manifest = Path('c/deepseek_v4_tiny.coli/manifest.coli').read_bytes()
          assert b'macos-arm64-metal-apple8-v1' in manifest
          PY
          cargo run --manifest-path colic/Cargo.toml -- \
            verify c/deepseek_v4_tiny.coli
