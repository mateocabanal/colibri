name: v4-prefix-ssd

on:
  pull_request:
    branches: [main]
    paths:
      - 'c/coli_v4_prefix_cache.c'
      - 'c/coli_v4_prefix_cache_impl.inc'
      - 'c/coli_v4_prefix_disk.c'
      - 'c/coli_v4_prefix_disk.h'
      - 'c/coli_v4_prefix_disk_shared.inc'
      - 'c/coli_v4_generate_stats_cache.c'
      - 'c/coli_v4_package_tensor_source.h'
      - 'c/coli_v4_*snapshot_size.c'
      - 'c/tests/test_v4_prefix_disk_sessions.c'
      - 'c/Makefile.deepseek-v4.units'
      - 'c/tools/make_deepseek_v4_tiny.py'
      - 'colic/**'

permissions:
  contents: read

concurrency:
  group: v4-prefix-ssd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ssd-only-restart:
    # PR1 freezes the Apple8 production profile before PR2 supplies its 0x0103
    # lowerer. The old Linux SSD restart oracle compiled a canonical artifact
    # while labelling it Apple8, which is now intentionally forbidden. Keep a
    # fail-closed sentinel here; PR2 restores the package/restart lifecycle once
    # the compiler can emit the frozen production layout.
    name: Linux Apple8 emission refusal contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate tiny V4 source fixture
        run: python c/tools/make_deepseek_v4_tiny.py --output c/deepseek_v4_tiny --force
      - name: Refuse false Apple8 exact-COLI emission until PR2
        run: |
          set +e
          output="$(cargo run --manifest-path colic/Cargo.toml -- \
            compile c/deepseek_v4_tiny \
            --target macos-arm64-metal-apple8-v1 \
            --quant exact --codec none --opt default \
            -o c/deepseek_v4_tiny.coli --verify 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -F 'production lowerer is not implemented'
          printf '%s\n' "$output" | grep -F 'refusing to emit a row/canonical artifact under that profile'
          test ! -e c/deepseek_v4_tiny.coli/manifest.coli
