name: V4 prefix store telemetry runtime

on:
  push:
    branches: [feat/v4-prompt-cache-metrics]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v4-prompt-cache-metrics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate tiny V4 fixture and build prefix benchmark
        run: |
          make -C c deepseek-v4-tiny-check V4_TRACE_EXEC=1
          make -C c -f Makefile.deepseek-v4 deepseek-v4-prefix-cache-test
      - name: Run cache-on/off probe and require store telemetry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          case = json.loads(Path('c/deepseek_v4_tiny/ref.json').read_text())['cases']['short']
          Path('/tmp/v4-prefix.txt').write_text(''.join(f'<t{t:03d}>' for t in case['prompt_ids']))
          PY
          python3 c/tools/benchmark_v4_prefix_cache.py \
            --binary c/benchmark_v4_prefix_cache_sessions \
            --model c/deepseek_v4_tiny \
            --prefix-file /tmp/v4-prefix.txt \
            --cache-mb 64 --min-prefix-tokens 1 \
            --memory-gb 3 --context 128 --max-new 1 \
            --trials 1 --timeout-sec 180 --repo . \
            --output /tmp/v4-prefix-store.json
          python3 - <<'PY'
          import json
          p = json.loads(open('/tmp/v4-prefix-store.json').read().splitlines()[-1])
          pair = p['pairs'][0]
          on = pair['cache_on']
          off = pair['cache_off']
          assert int(on['first_store_bytes']) > 0, on
          assert int(on['second_store_bytes']) > 0, on
          assert float(on['first_store_ms']) >= 0.0, on
          assert float(on['second_store_ms']) >= 0.0, on
          assert int(on['restore_bytes']) > 0, on
          assert int(off['first_store_bytes']) == 0, off
          assert int(off['second_store_bytes']) == 0, off
          assert p['cache_first_store_bytes_median'] > 0, p
          assert p['cache_second_store_bytes_median'] > 0, p
          assert p['cache_restore_ms_median'] >= 0, p
          print('V4 runtime store telemetry: ok')
          PY
      - name: Remove temporary runtime gate
        if: success()
        run: |
          git rm .github/workflows/v4-prefix-store-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v4): remove temporary store telemetry gate"
          git push origin HEAD:feat/v4-prompt-cache-metrics
