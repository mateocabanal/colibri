name: Stage Qwen profiler coverage fix

on:
  push:
    branches: [feat/qwen36-mxfp4]
    paths:
      - tools/stage_qwen_profile_fix.py
      - .github/workflows/qwen-profile-fix-stage.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply profiler coverage fix
        run: python3 tools/stage_qwen_profile_fix.py
      - name: Check patch
        run: git diff --check
      - name: Build and test CPU
        run: |
          make -C c clean
          make -C c tests/test_profile tests/test_qwen_moe qwen_moe -j2
          ./c/tests/test_profile
          ./c/tests/test_qwen_moe
      - name: Build Qwen Metal
        run: |
          make -C c clean
          make -C c qwen_moe METAL=1 -j2
      - name: Commit fix and remove staging files
        run: |
          rm tools/stage_qwen_profile_fix.py .github/workflows/qwen-profile-fix-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c/qwen_moe.c tools/stage_qwen_profile_fix.py .github/workflows/qwen-profile-fix-stage.yml
          git commit -m 'perf: complete qwen profiler coverage'
          git push origin HEAD:feat/qwen36-mxfp4
