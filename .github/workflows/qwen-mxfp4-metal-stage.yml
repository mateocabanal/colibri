name: Qwen MXFP4 Metal stage

on:
  push:
    branches: [feat/qwen36-mxfp4]

permissions:
  contents: write

jobs:
  integrate-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Metal integration
        run: |
          python3 tools/apply_qwen_mxfp4_metal.py
          python3 tools/fix_qwen_mxfp4_metal_shader.py
      - name: Run focused MXFP4 Metal oracle
        shell: bash
        run: |
          set +e
          make -C c metal-test 2>&1 | tee /tmp/metal-test.log
          set -e
          grep -E 'mxfp4 decode nb=4.*ok$' /tmp/metal-test.log
          grep -E 'mxfp4 ragged nb=3.*ok$' /tmp/metal-test.log
      - name: Build Qwen with Metal
        run: make -C c qwen_moe METAL=1
      - name: Commit Metal integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/backend_metal.h c/backend_metal.mm c/qwen_moe.c c/tests/test_backend_metal.mm
          git commit -m "fix(metal): decode MXFP4 in fused routed expert kernel"
          git push origin HEAD:feat/qwen36-mxfp4
