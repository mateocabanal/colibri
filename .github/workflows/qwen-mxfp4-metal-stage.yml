name: Qwen MXFP4 Metal stage

on:
  push:
    branches: [feat/qwen36-mxfp4]

permissions:
  contents: write

jobs:
  integrate-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Metal integration
        run: python3 tools/apply_qwen_mxfp4_metal.py
      - name: Run Metal backend oracle
        run: make -C c metal-test
      - name: Build Qwen with Metal
        run: make -C c qwen_moe METAL=1
      - name: Commit Metal integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/backend_metal.h c/backend_metal.mm c/qwen_moe.c c/tests/test_backend_metal.mm
          git commit -m "feat(qwen): run MXFP4 routed experts on Metal"
          git push origin HEAD:feat/qwen36-mxfp4
