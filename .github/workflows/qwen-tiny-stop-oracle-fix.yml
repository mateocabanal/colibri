name: Qwen tiny serve oracle fix

on:
  push:
    branches: [feat/qwen-prompt-prefix-cache]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qwen-prompt-prefix-cache
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Apply exact fixture/oracle correction
        run: python3 c/tools/apply_qwen_tiny_stop_patch.py
      - name: Validate generated target and real serve output
        run: |
          git diff --check
          python3 -m py_compile c/tools/make_qwen_moe_tiny.py c/tests/test_qwen_prefix_serve.py
          python c/tools/make_qwen_moe_tiny.py --output c/qwen_moe_tiny --force
          make -C c qwen_moe ARCH=x86-64-v3
          c/qwen_moe c/qwen_moe_tiny 2
          python c/tests/test_qwen_prefix_serve.py --binary c/qwen_moe --fixture c/qwen_moe_tiny
      - name: Commit real correction
        run: |
          git rm .github/workflows/qwen-tiny-stop-oracle-fix.yml c/tools/apply_qwen_tiny_stop_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/tools/make_qwen_moe_tiny.py c/tests/test_qwen_prefix_serve.py
          git commit -m "test(qwen): require generated tokens in prefix serve oracle"
          git push origin HEAD:feat/qwen-prompt-prefix-cache
