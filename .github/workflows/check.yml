# CI: run the repo's own dependency-free gate (`make check` = clean + portable
# CPU build + C unit suites + Python stdlib tests) on the three claimed
# platforms. Generated tiny-model jobs additionally exercise DeepSeek V4 target
# correctness and Qwen hybrid prompt-state reuse without production checkpoints.
name: check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make -C c check

  windows:
    # The job that would have caught #68/#137 pre-merge: native MinGW-w64
    # (MSYS2/UCRT64), the exact toolchain the README's Windows port targets.
    name: Windows UCRT64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: make check
        run: make -C c check

      # The Windows engine as this branch builds it. Small, and it makes an
      # antivirus false-positive report (#527) verifiable on a PR instead of
      # only after a release is tagged and published.
      - uses: actions/upload-artifact@v4
        with:
          name: colibri-windows-exe
          path: c/colibri.exe

  qwen-prefix-tiny:
    # The hybrid cache must restore more than ordinary attention KV: Qwen's
    # Gated DeltaNet layers also carry a recurrence matrix and convolution
    # history. The generated fixture exercises both layer kinds, then the serve
    # oracle compares a warm short->mixed prefix hit against a cold full prefill.
    name: Linux (generated tiny Qwen prefix oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          # Qwen's generator uses the same pinned torch/transformers/safetensors
          # stack as the V4 fixture. Keep one cache key until the pins diverge.
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate hybrid Qwen fixture
        run: python c/tools/make_qwen_moe_tiny.py --output c/qwen_moe_tiny --force
      - name: Build Qwen engine and validate cold target oracle
        run: |
          make -C c qwen_moe ARCH=x86-64-v3
          c/qwen_moe c/qwen_moe_tiny 2
      - name: Validate warm hybrid prompt reuse against cold prefill
        run: |
          python c/tests/test_qwen_prefix_serve.py \
            --binary c/qwen_moe --fixture c/qwen_moe_tiny

  v4-tiny:
    name: Linux (generated tiny V4 target oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate fixture and run target oracle
        # Normal builds leave expert-forward untouched. The generated target is
        # the dedicated correctness gate for the optional #56 execution hook.
        run: |
          make -C c deepseek-v4-tiny-check V4_TRACE_EXEC=1
          python c/tests/test_v4_execution_trace_tiny.py \
            --binary c/deepseek_v4 --fixture c/deepseek_v4_tiny
      - name: Publish tiny V4 source fixture
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-v4-tiny-source
          path: c/deepseek_v4_tiny
          if-no-files-found: error

  v4-tiny-coli-macos:
    # Compile the Linux-generated source fixture into the actual native Apple
    # COLI profile, then exercise the package-only runtime and reusable expert
    # slot generations on Apple Silicon. No torch/transformers install is needed
    # on this runner because the source fixture crosses jobs as a tiny artifact.
    name: macOS (native exact COLI V4 trace)
    needs: v4-tiny
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install libomp
        run: brew install libomp
      - name: Download generated V4 fixture
        uses: actions/download-artifact@v4
        with:
          name: deepseek-v4-tiny-source
          path: c/deepseek_v4_tiny
      - name: Compile native exact COLI package
        run: |
          cargo run --manifest-path colic/Cargo.toml -- \
            compile c/deepseek_v4_tiny \
            --target native --quant exact --codec none --opt default \
            -o c/deepseek_v4_tiny.coli --verify
      - name: Build detailed-trace V4 runtime
        run: |
          make -C c -f Makefile.deepseek-v4 deepseek-v4-clean
          make -C c -f Makefile.deepseek-v4 V4_TRACE_EXEC=1 deepseek-v4
      - name: Validate exact COLI physical/logical/execution lifecycle
        run: |
          python3 c/tests/test_v4_exact_coli_trace_tiny.py \
            --binary c/deepseek_v4 --package c/deepseek_v4_tiny.coli

  macos:
    # clang; libomp for the threaded path (Makefile falls back to
    # single-threaded automatically if it's ever missing).
    name: macOS (colibri + V4 platform gate)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install libomp
        run: brew install libomp
      - name: make check (V4 execution gated off)
        run: make -C c check
