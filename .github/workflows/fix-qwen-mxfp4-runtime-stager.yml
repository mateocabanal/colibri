name: Qwen MXFP4 runtime integrator

on:
  push:
    branches: [feat/qwen36-mxfp4]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Apply integration patch
        run: python3 tools/apply_qwen_mxfp4_runtime.py
      - name: Build and run focused tests
        shell: bash
        run: |
          make -C c -f Makefile.csf tests/test_mxfp4_runtime tests/test_mxfp4_expert
          make -C c tests/test_qwen_moe
          ./c/tests/test_mxfp4_runtime
          ./c/tests/test_mxfp4_expert
          ./c/tests/test_qwen_moe
      - name: Commit runtime integration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/qwen_moe.c c/Makefile c/tests/test_qwen_moe.c
          git commit -m "feat(qwen): wire MXFP4 COLI experts into runtime"
          git push origin HEAD:feat/qwen36-mxfp4
