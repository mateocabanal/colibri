name: Qwen adaptive residency

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: qwen-adaptive-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  tiny-sanitized:
    name: Linux tiny oracle (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - name: Install pinned tiny-fixture dependencies
        run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - name: Generate hybrid Qwen fixture
        run: python c/tools/make_qwen_moe_tiny.py --output c/qwen_moe_tiny --force
      - name: Build sanitized Qwen engine
        run: |
          make -C c qwen_moe ARCH=x86-64-v3 \
            EXTRA_CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            EXTRA_LDFLAGS='-fsanitize=address,undefined'
      - name: Validate cold target oracle under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: c/qwen_moe c/qwen_moe_tiny 2
      - name: Compare adaptive vs legacy physical expert loads
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          QWEN_PROFILE=1 \
          QWENMOE_MODE=greedy \
          QWENMOE_PROMPT_IDS='5,7,9,11,13,17,19,23' \
          QWENMOE_MAX_NEW=8 \
          c/qwen_moe c/qwen_moe_tiny 2 >adaptive.out 2>adaptive.log

          COLI_ADAPTIVE_RESIDENCY=0 \
          QWEN_PROFILE=1 \
          QWENMOE_MODE=greedy \
          QWENMOE_PROMPT_IDS='5,7,9,11,13,17,19,23' \
          QWENMOE_MAX_NEW=8 \
          c/qwen_moe c/qwen_moe_tiny 2 >legacy.out 2>legacy.log

          python - <<'PY'
          import re
          from pathlib import Path

          def generated_ids(path: str) -> list[int]:
              ids = []
              for line in Path(path).read_text().splitlines():
                  match = re.fullmatch(r'ID\s+(\d+)', line.strip())
                  if match:
                      ids.append(int(match.group(1)))
              if not ids:
                  raise SystemExit(f'{path}: missing generated ID rows')
              return ids

          def request_counter(path: str, name: str) -> int:
              lines = [
                  line for line in Path(path).read_text().splitlines()
                  if 'coli_profile' in line and 'scope=request' in line
              ]
              if not lines:
                  raise SystemExit(f'{path}: missing request profile row')
              match = re.search(rf'\b{name}=(\d+)\b', lines[-1])
              if not match:
                  raise SystemExit(f'{path}: missing {name} in request profile row')
              return int(match.group(1))

          adaptive_ids = generated_ids('adaptive.out')
          legacy_ids = generated_ids('legacy.out')
          if adaptive_ids != legacy_ids:
              raise SystemExit(
                  f'adaptive changed generated tokens: {adaptive_ids} != {legacy_ids}'
              )

          adaptive_loads = request_counter('adaptive.log', 'expert_loads')
          legacy_loads = request_counter('legacy.log', 'expert_loads')
          adaptive_hits = request_counter('adaptive.log', 'cache_hits')
          legacy_hits = request_counter('legacy.log', 'cache_hits')
          print(
              f'generated={adaptive_ids}; '
              f'adaptive expert_loads={adaptive_loads} cache_hits={adaptive_hits}; '
              f'legacy expert_loads={legacy_loads} cache_hits={legacy_hits}'
          )
          if adaptive_loads > legacy_loads:
              raise SystemExit(
                  f'adaptive residency increased physical expert loads: '
                  f'{adaptive_loads} > {legacy_loads}'
              )
          PY
