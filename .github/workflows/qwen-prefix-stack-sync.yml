name: Qwen prefix stack sync

on:
  push:
    branches: [feat/qwen-prompt-cache-metrics]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qwen-prompt-cache-metrics
          fetch-depth: 0
      - name: Merge latest correctness base and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/qwen-prompt-prefix-cache
          git merge --no-edit origin/feat/qwen-prompt-prefix-cache
          git rm .github/workflows/qwen-prefix-stack-sync.yml
          git commit -m "chore(qwen): remove temporary stack sync workflow"
          git push origin HEAD:feat/qwen-prompt-cache-metrics
