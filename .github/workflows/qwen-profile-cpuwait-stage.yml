name: Stage Qwen accelerator wait profiling

on:
  push:
    branches: [feat/qwen36-mxfp4]
    paths: [.github/workflows/qwen-profile-cpuwait-stage.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark synchronous Metal wait
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('c/qwen_moe.c')
          s=p.read_text()
          old='    [QPROF_METAL_MOE_WAIT]    = {"metal_moe_wait", 0},\n'
          new='    [QPROF_METAL_MOE_WAIT]    = {"metal_moe_wait", COLI_PROFILE_CPU_WAIT},\n'
          if old not in s and new not in s: raise SystemExit('missing Metal wait phase')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Run CPU regression tests
        run: |
          make -C c clean
          make -C c tests/test_profile tests/test_qwen_moe -j2
          ./c/tests/test_profile
          ./c/tests/test_qwen_moe
      - name: Build real Qwen Metal target
        run: |
          make -C c clean
          make -C c qwen_moe METAL=1 -j2
      - name: Commit and remove staging workflow
        run: |
          rm .github/workflows/qwen-profile-cpuwait-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c/qwen_moe.c .github/workflows/qwen-profile-cpuwait-stage.yml
          git commit -m 'perf: classify qwen metal waits in generic profiler'
          git push origin HEAD:feat/qwen36-mxfp4
