name: apply production v1.1 loader

on:
  push:
    branches:
      - codex/compiler-contracts-p0
    paths:
      - '.github/workflows/apply-production-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compiler-contracts-p0
          fetch-depth: 0
      - name: Normalize executor option block for scripted patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('c/coli_executor.h')
          text = p.read_text()
          old = '''typedef struct ColiExecutorOpenOptions {
              /* Required exact physical-layout ABI. There is deliberately no native
               * fallback in v1.0: accepting another target layout would be unsafe. */
              const char *required_profile;
              ColiCsfChecksumPolicy checksum_policy;
              /* Zero is unlimited. Otherwise reject records larger than this resident
               * slot contract when loading them. */
              uint64_t max_resident_record_bytes;
          } ColiExecutorOpenOptions;'''
          new = '''typedef struct ColiExecutorOpenOptions {
              const char *required_profile;
              ColiCsfChecksumPolicy checksum_policy;
              uint64_t max_resident_record_bytes;
          } ColiExecutorOpenOptions;'''
          if old not in text:
              raise SystemExit('executor option block changed unexpectedly')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply production loader patch
        run: |
          python3 tools/apply_production_loader.py
          python3 tools/production_loader_fixups.py
      - name: Rust compiler regression
        shell: bash
        run: |
          cargo fmt --manifest-path colic/Cargo.toml -- --check
          cargo test --locked --manifest-path colic/Cargo.toml --all-targets
      - name: CSF reader and target ABI regression
        run: make -C c -f Makefile.csf test
      - name: Build V4 production loader path
        run: make -C c -f Makefile.deepseek-v4 deepseek-v4 METAL=0 LTO=0
      - name: Source -> compiler -> production executor -> strict reader -> kernel
        run: bash tools/colic_e2e.sh "$RUNNER_TEMP/colic-production-e2e"
      - name: Commit tested convergence
        shell: bash
        run: |
          git config user.name 'colibri-codex'
          git config user.email 'colibri-codex@users.noreply.github.com'
          git add c tools/colic_e2e.sh
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v4): enforce CSF v1.1 target compatibility in production loader (#23 #53)'
            git pull --rebase origin codex/compiler-contracts-p0
            git push origin HEAD:codex/compiler-contracts-p0
          fi
