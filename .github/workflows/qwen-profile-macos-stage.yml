name: Validate Qwen profiler on macOS Metal

on:
  push:
    branches: [feat/qwen36-mxfp4]
    paths:
      - .github/workflows/qwen-profile-macos-stage.yml

permissions:
  contents: write

jobs:
  macos-metal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build profiler and Qwen Metal
        run: |
          make -C c clean
          make -C c tests/test_profile qwen_moe METAL=1 -j"$(sysctl -n hw.ncpu)"
          ./c/tests/test_profile
      - name: Remove validation workflow
        run: |
          rm .github/workflows/qwen-profile-macos-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove Qwen profiler macOS staging gate'
          git push origin HEAD:feat/qwen36-mxfp4
