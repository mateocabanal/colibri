name: V4 prefix capture summary integration

on:
  push:
    branches: [feat/v4-prompt-cache-metrics]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v4-prompt-cache-metrics
          fetch-depth: 0
      - name: Apply exact benchmark summary patch
        run: python3 c/tools/apply_v4_prefix_summary_patch.py
      - name: Validate Python and stacked diff
        run: |
          git diff --check
          python3 -m py_compile c/tools/benchmark_v4_prefix_cache.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('c/tools/benchmark_v4_prefix_cache.py').read_text()
          for key in (
              'cache_restore_ms_median',
              'cache_first_store_ms_median',
              'cache_second_store_ms_median',
              'cache_first_store_bytes_median',
              'cache_second_store_bytes_median',
          ):
              assert key in s, key
          print('V4 capture-cost summary fields: ok')
          PY
      - name: Commit clean benchmark summary
        run: |
          git rm .github/workflows/v4-prefix-summary-integration.yml c/tools/apply_v4_prefix_summary_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/tools/benchmark_v4_prefix_cache.py
          git commit -m "bench(v4): summarize prompt snapshot capture cost"
          git push origin HEAD:feat/v4-prompt-cache-metrics
