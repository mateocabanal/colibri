name: CSF reader

on:
  pull_request:
    paths:
      - 'c/coli_format.c'
      - 'c/coli_format.h'
      - 'c/Makefile.csf'
      - 'c/tests/test_coli_format.c'
      - 'c/tests/fixtures/csf-v1-tiny/**'
      - '.github/workflows/csf-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qwen-mxfp4-integrate:
    if: github.head_ref == 'feat/qwen36-mxfp4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Apply runtime integration
        run: python3 tools/apply_qwen_mxfp4_runtime.py
      - name: Build and test runtime integration
        run: |
          make -C c -f Makefile.csf tests/test_mxfp4_runtime tests/test_mxfp4_expert
          make -C c tests/test_qwen_moe
          ./c/tests/test_mxfp4_runtime
          ./c/tests/test_mxfp4_expert
          ./c/tests/test_qwen_moe
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/qwen_moe.c c/Makefile c/tests/test_qwen_moe.c
          git commit -m "feat(qwen): wire MXFP4 COLI experts into runtime"
          git push origin HEAD:feat/qwen36-mxfp4

  csf-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -C c -f Makefile.csf test
      - name: ASan + UBSan
        run: make -C c -f Makefile.csf test-asan

  csf-reader-windows:
    name: csf-reader (Windows UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build and test
        run: make -C c -f Makefile.csf test
