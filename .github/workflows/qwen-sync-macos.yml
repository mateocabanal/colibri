name: qwen synced cache macOS gate

on:
  push:
    branches: [sync/qwen-prompt-cache-main-20260817]

permissions:
  contents: write

jobs:
  apple-silicon:
    runs-on: macos-26-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/qwen-prompt-cache-main-20260817
          fetch-depth: 0
      - name: Build optimized Qwen natively
        run: |
          set -euxo pipefail
          brew install libomp || true
          make -C c qwen_moe ARCH=native
      - name: Prompt-cache and MXFP4 gates
        run: |
          set -euxo pipefail
          python3 c/tests/test_qwen_prefix_cache.py
          make -C c -f Makefile.csf test
      - name: Remove temporary gate
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/qwen-sync-macos.yml
          git commit -m 'chore(qwen): remove temporary Apple sync gate'
          git push origin HEAD:sync/qwen-prompt-cache-main-20260817
