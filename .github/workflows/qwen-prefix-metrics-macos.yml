name: Qwen prefix metrics macOS gate

on:
  push:
    branches: [feat/qwen-prompt-cache-metrics]

permissions:
  contents: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qwen-prompt-cache-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: c/tools/requirements-deepseek-v4-tiny.txt
      - run: python -m pip install -r c/tools/requirements-deepseek-v4-tiny.txt
      - run: python c/tools/make_qwen_moe_tiny.py --output c/qwen_moe_tiny --force
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-prefix-metrics-tiny
          path: c/qwen_moe_tiny
          if-no-files-found: error

  macos:
    needs: fixture
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qwen-prompt-cache-metrics
          fetch-depth: 0
      - run: brew install libomp
      - uses: actions/download-artifact@v4
        with:
          name: qwen-prefix-metrics-tiny
          path: c/qwen_moe_tiny
      - name: Build native Qwen and rerun hybrid correctness oracle
        run: |
          make -C c qwen_moe ARCH=native
          python3 c/tests/test_qwen_prefix_serve.py \
            --binary c/qwen_moe --fixture c/qwen_moe_tiny
      - name: Exercise fixed-memory benchmark on Apple Silicon
        run: |
          printf '<t005><t007><t009><t011><t013><t017><t019><t023>' > /tmp/qwen-prefix.txt
          printf '<t029><t031><t037><t041><t043><t047>' > /tmp/qwen-tail.txt
          unset CACHE
          python3 c/tools/benchmark_qwen_prefix_cache.py \
            --binary c/qwen_moe --model c/qwen_moe_tiny \
            --prefix-file /tmp/qwen-prefix.txt --tail-file /tmp/qwen-tail.txt \
            --memory-gb 4.5 --cache-mb 8 --min-prefix-tokens 1 \
            --context 128 --max-tokens 1 --trials 1 \
            --output /tmp/qwen-prefix-bench-macos.json
          python3 - <<'PY'
          import json, platform
          p = json.load(open('/tmp/qwen-prefix-bench-macos.json'))
          assert p['matched_tokens'] == 8
          assert p['snapshot_bytes'] > 0
          assert p['summary']['restore_ms_median'] >= 0
          assert p['summary']['capture_ms_median'] >= 0
          print('machine=', platform.machine())
          print('summary=', json.dumps(p['summary'], sort_keys=True))
          PY
      - name: Remove temporary branch-only workflow
        run: |
          git rm .github/workflows/qwen-prefix-metrics-macos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(qwen): remove temporary macOS prefix metrics gate"
          git push origin HEAD:feat/qwen-prompt-cache-metrics
