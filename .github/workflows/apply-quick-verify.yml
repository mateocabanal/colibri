name: apply quick verification

on:
  push:
    branches:
      - codex/compiler-contracts-p0
    paths:
      - '.github/workflows/apply-quick-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compiler-contracts-p0
          fetch-depth: 0
      - run: python3 tools/apply_quick_verify.py
      - run: cargo fmt --manifest-path colic/Cargo.toml
      - run: cargo test --locked --manifest-path colic/Cargo.toml --all-targets
      - name: Commit tested change
        shell: bash
        run: |
          git config user.name 'colibri-codex'
          git config user.email 'colibri-codex@users.noreply.github.com'
          git add colic/src/verify.rs colic/src/pipeline.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(colic): structurally verify temporary package before publish (#52)'
            git pull --rebase origin codex/compiler-contracts-p0
            git push origin HEAD:codex/compiler-contracts-p0
          fi
