name: colic end-to-end

on:
  push:
    branches:
      - codex/compiler-contracts-p0
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run source-to-kernel compiled-path gate
        shell: bash
        run: bash tools/colic_e2e.sh
