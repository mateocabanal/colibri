name: qwen-windows-alias-fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: qwen-windows-alias-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'fix/qwen-windows-make-alias'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch alias and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('c/Makefile')
          s = p.read_text()
          marker = 'qwen_moe$(EXE): qwen_moe.c qwen_prefix_cache.h'
          assert marker in s
          alias = 'ifneq ($(EXE),)\n.PHONY: qwen_moe\nqwen_moe: qwen_moe$(EXE)\nendif\n\n'
          if alias not in s:
              i = s.index(marker)
              s = s[:i] + alias + s[i:]
              p.write_text(s)
          PY
          make -C c qwen_moe ARCH=x86-64-v3
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/qwen-windows-alias-fix.yml
          git add c/Makefile
          git config user.name 'colibri-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(build): route qwen_moe alias to platform executable'
          git push origin HEAD:${{ github.head_ref }}
