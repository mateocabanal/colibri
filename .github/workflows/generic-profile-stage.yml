name: Stage generic profiler integration

on:
  push:
    branches: [feat/qwen36-mxfp4]
    paths:
      - .github/workflows/generic-profile-stage.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: |
          python3 tools/stage_generic_profile.py
          python3 tools/stage_profile_metal_decl.py
      - name: Check patch
        run: git diff --check
      - name: Build and test generic and Qwen profiling
        run: |
          make -C c clean
          make -C c tests/test_profile tests/test_qwen_moe qwen_moe -j2
          ./c/tests/test_profile
          ./c/tests/test_qwen_moe
      - name: Build DeepSeek V4 against generic profiler
        run: make -C c -f Makefile.deepseek-v4 METAL=0 deepseek-v4 -j2
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: share phase profiler across V4 and Qwen'
          git push origin HEAD:feat/qwen36-mxfp4
