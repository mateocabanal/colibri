name: qwen-default-cache-apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/qwen-prefix-cache-default-on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply policy patch
        run: python3 .github/scripts/apply_qwen_default_cache.py
      - name: Validate
        run: |
          make -C c test-qwen-prefix-cache
          make -C c qwen_moe ARCH=x86-64-v3
      - name: Publish implementation
        run: |
          git rm .github/workflows/qwen-default-cache-apply.yml
          git rm .github/workflows/qwen-default-cache-impl.yml
          git rm .github/scripts/apply_qwen_default_cache.py
          git add c/qwen_prefix_cache.h c/qwen_moe.c c/tests/test_qwen_prefix_cache.c
          git config user.name 'colibri-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(qwen): enable prompt cache by default in serve mode'
          git push origin HEAD:${{ github.head_ref }}
