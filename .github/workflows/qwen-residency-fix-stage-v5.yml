name: Stage Qwen COLI residency fixes v5

on:
  push:
    branches: [feat/qwen36-mxfp4]
    paths: [.github/workflows/qwen-residency-fix-stage-v5.yml]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/qwen_residency_fix.py'); s=p.read_text()
          old='b = g_slabs[i].buf; g_slabs[i].buf=nil; g_slabs.erase(g_slabs.begin()+i); break;\\n    }\\n  }\\n'
          new='b = g_slabs[i].buf; g_slabs[i].buf=nil; g_slabs.erase(g_slabs.begin()+i); break; }\\n  }\\n'
          if old not in s: raise SystemExit('unregister staging pattern missing')
          s=s.replace(old,new,1)
          old2='    ColiCsfShard *shard;\\n'
          new2='    const ColiCsfShard *shard;\\n'
          if old2 not in s: raise SystemExit('shard const staging pattern missing')
          p.write_text(s.replace(old2,new2,1))
          PY
          python3 .github/scripts/qwen_residency_fix.py
          git diff --check
      - name: Build and run portable tests
        run: |
          cc -O2 -Wall -Wextra -Werror -I c -c c/coli_format.c -o /tmp/coli_format.o
          cc -O2 -Wall -Wextra -Werror -I c -c c/mxfp4_expert.c -o /tmp/mxfp4_expert.o
          cc -O2 -Wall -Wextra -Wno-misleading-indentation -I c c/tests/test_coli_format.c c/coli_format.c c/coli_executor.c -lpthread -o /tmp/test_coli_format
          cc -O2 -Wall -Wextra -I c c/tests/test_mxfp4_expert.c c/mxfp4_expert.c c/coli_format.c -lpthread -o /tmp/test_mxfp4_expert
          (cd c && /tmp/test_coli_format)
          /tmp/test_mxfp4_expert
          make -C c clean
          make -C c tests/test_qwen_moe -j2
          ./c/tests/test_qwen_moe
      - name: Test ordered interval lookup semantics
        run: |
          cat > /tmp/test_interval.cpp <<'EOF'
          #include <cstdint>
          #include <map>
          #include <cstdio>
          struct Slab { uintptr_t base; size_t len; int id; };
          static std::map<uintptr_t, Slab> slabs;
          static int resolve(uintptr_t u) {
            auto it=slabs.upper_bound(u);
            if(it==slabs.begin()) return -1;
            --it;
            uintptr_t base=it->first;
            const Slab &s=it->second;
            if((u-base)>=s.len) return -1;
            return s.id;
          }
          int main(){
            for(int i=0;i<128;i++){
              uintptr_t b=0x100000u+(uintptr_t)i*0x8000u;
              slabs.emplace(b,Slab{b,0x4000u,i});
              if(resolve(b)!=i || resolve(b+0x3fffu)!=i || resolve(b+0x4000u)!=-1) return 1;
            }
            if(resolve(0xfffffu)!=-1) return 2;
            for(int i=0;i<128;i+=2){
              uintptr_t b=0x100000u+(uintptr_t)i*0x8000u;
              slabs.erase(b);
              if(resolve(b)!=-1 || resolve(b+0x2000u)!=-1) return 3;
            }
            for(int i=1;i<128;i+=2){
              uintptr_t b=0x100000u+(uintptr_t)i*0x8000u;
              if(resolve(b+0x2000u)!=i) return 4;
            }
            std::puts("PASS ordered interval lookup");
            return 0;
          }
          EOF
          c++ -std=c++17 -O2 -Wall -Wextra -Werror /tmp/test_interval.cpp -o /tmp/test_interval
          /tmp/test_interval
      - name: Build Qwen Metal
        if: runner.os == 'macOS'
        run: |
          make -C c clean
          make -C c qwen_moe METAL=1 -j2

  commit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/qwen_residency_fix.py'); s=p.read_text()
          old='b = g_slabs[i].buf; g_slabs[i].buf=nil; g_slabs.erase(g_slabs.begin()+i); break;\\n    }\\n  }\\n'
          new='b = g_slabs[i].buf; g_slabs[i].buf=nil; g_slabs.erase(g_slabs.begin()+i); break; }\\n  }\\n'
          if old not in s: raise SystemExit('unregister staging pattern missing')
          s=s.replace(old,new,1)
          old2='    ColiCsfShard *shard;\\n'
          new2='    const ColiCsfShard *shard;\\n'
          if old2 not in s: raise SystemExit('shard const staging pattern missing')
          p.write_text(s.replace(old2,new2,1))
          PY
          python3 .github/scripts/qwen_residency_fix.py
          git diff --check
          rm -f .github/scripts/qwen_residency_fix.py
          rm -f .github/workflows/qwen-residency-fix-stage.yml \
                .github/workflows/qwen-residency-fix-stage-v2.yml \
                .github/workflows/qwen-residency-fix-stage-v3.yml \
                .github/workflows/qwen-residency-fix-stage-v4.yml \
                .github/workflows/qwen-residency-fix-stage-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: fix streamed expert residency scaling'
          git push origin HEAD:feat/qwen36-mxfp4
