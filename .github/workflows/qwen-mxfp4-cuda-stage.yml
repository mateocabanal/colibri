name: Qwen MXFP4 CUDA stage

on:
  push:
    branches: [feat/qwen36-mxfp4]

permissions:
  contents: write

jobs:
  cuda-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen36-mxfp4
          fetch-depth: 0
          persist-credentials: true
      - name: Install CUDA compiler/runtime
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.2'
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - name: Apply CUDA integration
        run: python3 tools/apply_qwen_mxfp4_cuda.py
      - name: CUDA syntax and link checks
        shell: bash
        run: |
          cd c
          nvcc -O2 -std=c++17 -arch=sm_80 -c backend_cuda.cu -o /tmp/backend_cuda.o -Xcompiler=-Wall,-Wextra
          gcc -O2 -c tests/mxfp4_ref.c -o /tmp/mxfp4_ref.o
          nvcc -O2 -std=c++17 -arch=sm_80 tests/test_mxfp4_cuda.cu backend_cuda.cu /tmp/mxfp4_ref.o -o /tmp/test_mxfp4_cuda
          make qwen_moe CUDA=1 CUDA_ARCH=sm_80
      - name: Portable Qwen regression test
        run: make -C c tests/test_qwen_moe && ./c/tests/test_qwen_moe
      - name: Commit CUDA integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c/backend_cuda.h c/backend_cuda.cu c/qwen_moe.c c/Makefile c/tests/test_mxfp4_cuda.cu
          git commit -m "feat(qwen): run streamed MXFP4 experts on CUDA"
          git push origin HEAD:feat/qwen36-mxfp4
